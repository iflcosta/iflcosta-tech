<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada — iflStudio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #080c14;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrapper { max-width: 480px; }
    .code {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0891b2, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #8b9cc8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: #0891b2;
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      border-radius: 12px;
      text-decoration: none;
      transition: background 250ms ease, transform 150ms ease;
    }
    .btn:hover { background: #0e7490; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Mas não se preocupe — seu próximo projeto de alta performance está a um clique de distância.</p>
    <a href="/" class="btn">
      <span>⚡</span>
      <span>Voltar para o início</span>
    </a>
  </div>
</body>
</html>
