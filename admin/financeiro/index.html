<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Iago Lopes | Hardware & Tech</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', var(--font-sans); }

    .fin-period-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-5);
    }
    .fin-period-btn {
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-surface);
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .fin-period-btn:hover { background: var(--color-bg-subtle); }
    .fin-period-btn.active {
      background: var(--color-brand);
      color: #fff;
      border-color: var(--color-brand);
    }

    .fin-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    @media (min-width: 1024px) {
      .fin-cards { grid-template-columns: repeat(4, 1fr); }
    }

    .fin-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .fin-card-label {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-2);
    }
    .fin-card-value {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--color-text-primary);
      line-height: 1.2;
    }
    .fin-card-value.receita { color: var(--color-brand); }
    .fin-card-value.lucro   { color: hsl(142, 65%, 40%); }
    .fin-card-value.receber { color: hsl(32, 95%, 45%); }
    .fin-card-sub {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-top: var(--space-1);
    }

    .fin-section {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-5);
    }
    .fin-section-title {
      font-size: var(--text-base);
      font-weight: var(--font-bold);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    #grafico-financeiro {
      width: 100%;
      height: 220px;
      display: block;
    }

    .receber-empty {
      text-align: center;
      padding: var(--space-8) 0;
      color: var(--color-text-tertiary);
    }
    .payment-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: var(--font-semibold);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
    }
    .payment-pill.pendente { background: rgba(234,179,8,.15); color: hsl(38,92%,40%); }
    .payment-pill.parcial  { background: rgba(249,115,22,.15); color: hsl(22,90%,40%); }

    .custom-range {
      display: none;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .custom-range.visible { display: flex; }
    .custom-range input[type="date"] {
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      font-size: var(--text-sm);
    }
  </style>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

<div class="admin-shell">
  <main class="admin-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Financeiro</h1>
        <p class="page-subtitle">Receitas, lucro e contas a receber da operação.</p>
      </div>
    </div>

    <!-- Filtro de Período -->
    <div class="fin-period-bar">
      <button class="fin-period-btn active" data-periodo="este_mes">Este mês</button>
      <button class="fin-period-btn" data-periodo="mes_anterior">Mês anterior</button>
      <button class="fin-period-btn" data-periodo="este_ano">Este ano</button>
      <button class="fin-period-btn" data-periodo="custom">Personalizado</button>
      <div class="custom-range" id="custom-range">
        <input type="date" id="date-from">
        <span style="color:var(--color-text-tertiary);">até</span>
        <input type="date" id="date-to">
        <button class="btn btn--primary btn--sm" id="btn-apply-custom">Aplicar</button>
      </div>
    </div>

    <!-- Cards de Resumo -->
    <div class="fin-cards">
      <div class="fin-card">
        <div class="fin-card-label">💰 Receita</div>
        <div class="fin-card-value receita" id="card-receita">—</div>
        <div class="fin-card-sub" id="card-os-count">— OS entregues</div>
      </div>
      <div class="fin-card">
        <div class="fin-card-label">📈 Lucro Bruto</div>
        <div class="fin-card-value lucro" id="card-lucro">—</div>
        <div class="fin-card-sub" id="card-margem">Margem —</div>
      </div>
      <div class="fin-card">
        <div class="fin-card-label">⏳ A Receber</div>
        <div class="fin-card-value receber" id="card-receber">—</div>
        <div class="fin-card-sub" id="card-receber-count">— OS pendentes</div>
      </div>
      <div class="fin-card">
        <div class="fin-card-label">🎯 Ticket Médio</div>
        <div class="fin-card-value" id="card-ticket">—</div>
        <div class="fin-card-sub">Por OS entregue</div>
      </div>
    </div>

    <!-- Gráfico de Tendência -->
    <div class="fin-section">
      <div class="fin-section-title">📊 Tendência — Últimos 6 Meses</div>
      <canvas id="grafico-financeiro" aria-label="Gráfico de receita e lucro por mês"></canvas>
      <div style="display:flex;gap:var(--space-4);margin-top:var(--space-3);font-size:var(--text-xs);color:var(--color-text-secondary);">
        <span><span style="display:inline-block;width:12px;height:12px;background:var(--color-brand);border-radius:2px;margin-right:4px;vertical-align:middle;"></span>Receita</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:hsl(142,65%,45%);border-radius:2px;margin-right:4px;vertical-align:middle;"></span>Lucro</span>
      </div>
    </div>

    <!-- Tabela A Receber -->
    <div class="fin-section">
      <div class="fin-section-title">🔔 A Receber <span id="badge-receber" style="font-size:var(--text-xs);font-weight:var(--font-normal);color:var(--color-text-tertiary);margin-left:auto;"></span></div>
      <div id="receber-container">
        <div class="receber-empty" id="receber-loading">Carregando...</div>
      </div>
    </div>

  </main>
</div>

<script src="/assets/js/admin/layout.js" type="module"></script>
<script src="/assets/js/admin/financeiro.js" type="module"></script>
</body>
</html>
