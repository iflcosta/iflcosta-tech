<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar no Painel — Iago Lopes | Hardware & Tech</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', var(--font-sans);
    }
  </style>
</head>
<body class="admin-login-body">

  <main class="login-card" aria-labelledby="login-title">
    <div class="login-header">
      <div id="login-title" class="login-logo">
        <span>IL</span>
        <span style="font-weight: var(--font-regular); font-size: var(--text-base); color: var(--color-text-tertiary);">|</span>
        <span style="font-size: var(--text-lg);">Admin</span>
      </div>
      <p class="login-subtitle">Gestão integrada e produtividade solo</p>
    </div>

    <!-- Mensagens de Feedback para o usuário -->
    <div id="feedback" class="feedback-message" role="alert" aria-live="assertive"></div>

    <!-- Form Principal (Híbrido: Magic Link + OTP) -->
    <form id="login-form" novalidate class="form-group" style="gap: var(--space-4);">
      <!-- Etapa 1: E-mail -->
      <div id="email-step-container" class="form-group" style="gap: var(--space-4); width: 100%;">
        <div class="form-group">
          <label for="email" class="form-label">Seu e-mail cadastrado</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="exemplo@outlook.com" 
            required 
            autocomplete="email" 
            inputmode="email"
          >
        </div>

        <button type="submit" id="submit-btn" class="btn-auth">
          <span id="btn-text">Receber link de acesso</span>
        </button>
      </div>

      <!-- Etapa 2: Código OTP (inicialmente oculto) -->
      <div id="otp-step-container" class="form-group" style="display: none; gap: var(--space-4); width: 100%;">
        <div class="form-group">
          <label for="otp" class="form-label">Código de acesso do e-mail</label>
          <input 
            type="text" 
            id="otp" 
            name="otp" 
            class="form-input" 
            placeholder="Código recebido" 
            required 
            maxlength="8"
            pattern="[0-9]{6,8}"
            inputmode="numeric"
            autocomplete="one-time-code"
            style="letter-spacing: 0.2em; text-align: center; font-family: monospace; font-size: var(--text-xl); font-weight: var(--font-bold);"
          >
        </div>

        <button type="button" id="submit-otp-btn" class="btn-auth">
          <span id="btn-otp-text">Confirmar e Entrar</span>
        </button>

        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: var(--space-1);">
          <button type="button" id="back-to-email-btn" style="background: none; border: none; color: var(--color-text-secondary); font-size: var(--text-xs); cursor: pointer; padding: var(--space-1) 0; font-family: inherit;">
            ← Voltar
          </button>
          <button type="button" id="resend-otp-btn" style="background: none; border: none; color: var(--color-brand); font-size: var(--text-xs); cursor: pointer; padding: var(--space-1) 0; font-family: inherit; font-weight: var(--font-bold);">
            Reenviar código
          </button>
        </div>
      </div>
    </form>

    <div class="divider">ou</div>

    <!-- Seção de login por Senha (colapsável) -->
    <div class="form-group">
      <button id="toggle-password-btn" class="collapsible-trigger" aria-expanded="false" aria-controls="password-section">
        <span>▸ Entrar com senha tradicional</span>
      </button>

      <div id="password-section" class="collapsible-content" role="region" aria-labelledby="toggle-password-btn">
        <form id="password-form" novalidate class="form-group" style="gap: var(--space-4);">
          <div class="form-group">
            <label for="password" class="form-label">Sua senha forte</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" id="submit-password-btn" class="btn-auth" style="background: var(--color-bg-inverse); color: var(--color-text-inverse);">
            <span id="btn-password-text">Entrar com senha</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="../assets/js/admin/login.js?v=1.0.2" type="module"></script>
</body>
</html>
